<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Firebase Hosting</title>

    <!-- update the version number as needed -->
    <script defer src="/__/firebase/11.6.1/firebase-app-compat.js"></script>
    <!-- include only the Firebase features as you need -->
    <script defer src="/__/firebase/11.6.1/firebase-auth-compat.js"></script>
    <script
      defer
      src="/__/firebase/11.6.1/firebase-database-compat.js"
    ></script>
    <script
      defer
      src="/__/firebase/11.6.1/firebase-firestore-compat.js"
    ></script>
    <script
      defer
      src="/__/firebase/11.6.1/firebase-functions-compat.js"
    ></script>
    <script
      defer
      src="/__/firebase/11.6.1/firebase-messaging-compat.js"
    ></script>
    <script defer src="/__/firebase/11.6.1/firebase-storage-compat.js"></script>
    <script
      defer
      src="/__/firebase/11.6.1/firebase-analytics-compat.js"
    ></script>
    <script
      defer
      src="/__/firebase/11.6.1/firebase-remote-config-compat.js"
    ></script>
    <script
      defer
      src="/__/firebase/11.6.1/firebase-performance-compat.js"
    ></script>
    <!-- 
      initialize the SDK after all desired features are loaded, set useEmulator to false
      to avoid connecting the SDK to running emulators.
    -->
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>
  </head>
  <body>
    <h2>Registro</h2>
    <input id="name" placeholder="Nome" />
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Senha" />
    <button onclick="register()">Registrar</button>

    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Senha" />
    <button onclick="login()">Entrar</button>

    <h2>Upload de Arquivo</h2>
    <input type="file" id="fileInput" />
    <button onclick="uploadFile()">Enviar</button>

    <ul id="fileList"></ul>
    <script defer>
      document.addEventListener("DOMContentLoaded", function () {
        const loadEl = document.querySelector("#load");
        // // 🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥
        // // The Firebase SDK is initialized and available here!
        //
        // firebase.auth().onAuthStateChanged(user => { });
        // firebase.database().ref('/path/to/ref').on('value', snapshot => { });
        // firebase.firestore().doc('/foo/bar').get().then(() => { });
        // firebase.functions().httpsCallable('yourFunction')().then(() => { });
        // firebase.messaging().requestPermission().then(() => { });
        // firebase.storage().ref('/path/to/ref').getDownloadURL().then(() => { });
        // firebase.analytics(); // call to activate
        // firebase.analytics().logEvent('tutorial_completed');
        // firebase.performance(); // call to activate
        //
        // // 🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥🔥

        try {
          let app = firebase.app();
          let features = [
            "auth",
            "database",
            "firestore",
            "functions",
            "messaging",
            "storage",
            "analytics",
            "remoteConfig",
            "performance",
          ].filter((feature) => typeof app[feature] === "function");
          loadEl.textContent = `Firebase SDK loaded with ${features.join(
            ", "
          )}`;
        } catch (e) {
          console.error(e);
          loadEl.textContent =
            "Error loading the Firebase SDK, check the console.";
        }
      });
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
      const storage = firebase.storage();

      async function register() {
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const userCredential = await firebase
            .auth()
            .createUserWithEmailAndPassword(email, password);
          const user = userCredential.user;

          await db.collection("usuarios").doc(user.uid).set({
            uid: user.uid,
            nome: name,
            email: user.email,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
          });

          alert("Usuário registrado!");
        } catch (e) {
          alert("Erro: " + e.message);
        }
      }

      async function login() {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        try {
          const userCredential = await firebase
            .auth()
            .signInWithEmailAndPassword(email, password);
          alert("Logado como: " + userCredential.user.email);
          listFiles();
        } catch (e) {
          alert("Erro: " + e.message);
        }
      }

      async function uploadFile() {
        const file = document.getElementById("fileInput").files[0];
        const user = firebase.auth().currentUser;

        if (!user || !file) return;

        const ref = storage.ref(`uploads/${user.uid}/${file.name}`);
        await ref.put(file);
        alert("Upload concluído!");
        listFiles();
      }

      async function listFiles() {
        const user = firebase.auth().currentUser;
        const ref = storage.ref(`uploads/${user.uid}/`);
        const result = await ref.listAll();

        const list = document.getElementById("fileList");
        list.innerHTML = "";

        result.items.forEach(async (item) => {
          const url = await item.getDownloadURL();
          const li = document.createElement("li");
          li.innerHTML = `<a href="${url}" target="_blank">${item.name}</a>`;
          list.appendChild(li);
        });
      }

      firebase.auth().onAuthStateChanged((user) => {
        if (user) listFiles();
      });
    </script>
  </body>
</html>
